<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Comida">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A221D" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<title>Plan Nacho y Teresa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: market-board planner — sticky header (tabs + person switch), "Hoy" as home, 7-day colour grid, detail in a sliding sheet, full-screen cooking mode */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --sunk:#E9EDE4; --ink:#17221B; --muted:#5B685F; --line:#D8DFD3;
  --accent:#0A7448; --accent-ink:#FFFFFF;
  --des:#E3940A; --alm:#D5462A; --mer:#5C8A1C; --cen:#2C5BA6; --pos:#8B4A2B;
  --nacho:#0E7A84; --teresa:#C03C66;
  --ok:#1F8A4C; --warn:#C27C0E; --bad:#C2382B;
  --tint:14%;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#1A221D; --sunk:#222C26; --ink:#E8EEE8; --muted:#9AA79E; --line:#2F3B34;
  --accent:#37B57A; --accent-ink:#0B1A12;
  --des:#F0AE3C; --alm:#EE6D52; --mer:#8DBA4A; --cen:#6E98DE; --pos:#C98A65;
  --nacho:#3FB7C1; --teresa:#EE7398; --ok:#4CC27F; --warn:#E9A93B; --bad:#EE6D5F; --tint:20%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#1A221D; --sunk:#222C26; --ink:#E8EEE8; --muted:#9AA79E; --line:#2F3B34;
  --accent:#37B57A; --accent-ink:#0B1A12;
  --des:#F0AE3C; --alm:#EE6D52; --mer:#8DBA4A; --cen:#6E98DE; --pos:#C98A65;
  --nacho:#3FB7C1; --teresa:#EE7398; --ok:#4CC27F; --warn:#E9A93B; --bad:#EE6D5F; --tint:20%; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:1.4rem;font-weight:800}
.brand h1 .amp{color:var(--accent)}
.sync{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--bad)}
nav.tabs{display:flex;gap:2px;background:var(--sunk);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%}
nav.tabs a{text-decoration:none;color:var(--muted);padding:7px 13px;border-radius:999px;font-weight:600;font-size:.88rem;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:7px 12px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[data-who="N"][aria-pressed="true"]{background:var(--nacho);color:#fff}
.seg button[data-who="T"][aria-pressed="true"]{background:var(--teresa);color:#fff}
@media (max-width:640px){.top .wrap{gap:8px}.brand h1{font-size:1.2rem}nav.tabs{order:3;width:100%}nav.tabs a{flex:1;text-align:center;padding:7px 8px}}

main{padding-block:18px 64px}
section.view{display:flex;flex-direction:column;gap:16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar h2{font-size:1.3rem}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.pill,.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.note{color:var(--muted);font-size:.84rem;max-width:80ch;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h3{font-size:1.05rem;margin-bottom:10px}
.panel ol,.panel ul{margin:0;padding-left:1.2em;display:grid;gap:6px;max-width:75ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;width:max-content}
.tag.train{background:var(--ink);color:var(--bg)} .tag.rest{background:var(--sunk);color:var(--muted)} .tag.opt{border:1px dashed var(--muted);color:var(--muted)}
.tag.rot{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:block}
.meter i{display:block;height:100%;border-radius:3px}
.chip{font-family:var(--f-mono);font-size:.7rem;padding:1px 6px;border-radius:999px;background:var(--surface);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip .k{width:6px;height:6px;border-radius:50%}
.chip.done{background:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:4px}

/* HOY */
.hoyhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px}
.hoyhead h2{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;line-height:1.05}
.hoyhead .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.now{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:14px 16px}
.now .lab{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.now b{font-family:var(--f-display);font-size:1.15rem;display:block}
@media (max-width:560px){.now{grid-template-columns:1fr}.now .lab{order:-1}}
.hoycols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.hcol{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;min-width:0}
.hcol header{display:flex;align-items:center;gap:8px}
.hcol header h3{font-size:1.05rem}
.hcol header .p{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.hrow{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hrow .bar4{align-self:stretch;border-radius:2px;background:var(--c)}
.hrow .tx{display:grid;gap:2px;min-width:0;text-align:left;background:none;border:0;padding:0}
.hrow .tx small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hrow .tx span{font-weight:600;font-size:.92rem}
.hrow .tx em{font-style:normal;font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.check{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;color:transparent}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tasks{display:grid;gap:8px}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.task .ti{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c);font-weight:800;font-family:var(--f-display)}
.task p{margin:0;max-width:75ch}
.task p b{font-weight:600}

/* summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.who-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.who-card header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who-card h3{font-size:1.05rem}
.who-card .sub{color:var(--muted);font-size:.8rem;margin-left:auto}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.metric{display:grid;gap:4px;min-width:0}
.metric .lab{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.metric .val{font-family:var(--f-mono);font-size:.9rem}
.metric .val small{color:var(--muted);font-size:.7rem}
.adh{display:flex;align-items:center;gap:10px;font-size:.84rem}
.adh b{font-family:var(--f-mono);font-size:1.25rem;font-weight:500}
.msg{font-size:.84rem;margin:0;padding:8px 10px;border-radius:8px;background:var(--sunk)}
@media (max-width:640px){.metrics{grid-template-columns:repeat(3,1fr)}}

/* calendar */
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav h2{font-size:1.2rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal{display:grid;grid-template-columns:104px repeat(7,minmax(148px,1fr));min-width:1140px}
.cal > div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.cal > div:nth-child(8n){border-right:0}
.dayhead{padding:10px 10px 8px;display:grid;gap:4px;background:var(--surface)}
.dayhead.today{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.dayhead .dn{font-family:var(--f-display);font-weight:700;font-size:1rem}
.dayhead .dd{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.rowhead{padding:10px;display:flex;flex-direction:column;justify-content:center;gap:2px;background:var(--surface)}
.rowhead b{font-family:var(--f-display);font-size:.92rem}
.rowhead span{font-size:.72rem;color:var(--muted)}
.cell{padding:6px;display:flex;flex-direction:column;gap:6px}
.meal{--c:var(--des);text-align:left;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border-radius:6px;padding:8px 9px;display:grid;gap:5px;width:100%;transition:transform .12s ease,box-shadow .12s ease}
.meal:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgb(0 0 0 / .08)}
.meal .mn{font-weight:600;font-size:.84rem;line-height:1.25}
.meal .who{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.meal .sw2{font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.meal.plain{--c:var(--muted);background:var(--sunk)}
.cell .empty{font-size:.75rem;color:var(--muted);padding:6px}
.totals{padding:8px 10px;display:grid;gap:7px;background:var(--surface)}
.tline{display:grid;gap:3px}
.tline .tt{display:flex;justify-content:space-between;gap:6px;font-size:.74rem}
.tline .tt b{font-family:var(--f-mono);font-weight:500}
.tline .tt span{color:var(--muted)}
.daypick{display:none;gap:6px;overflow-x:auto;padding-bottom:2px}
.daypick button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;display:grid;justify-items:center;gap:1px;min-width:50px}
.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daypick b{font-family:var(--f-display);font-size:.95rem}
.daypick span{font-family:var(--f-mono);font-size:.7rem;opacity:.8}
.dayview{display:none;flex-direction:column;gap:10px}
.dv-slot{display:grid;gap:6px}
.dv-slot h4{font-size:.85rem;font-weight:600}
@media (max-width:760px){.calwrap{display:none}.daypick{display:flex}.dayview{display:flex}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 16 12 / .45);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
.sheet{background:var(--bg);width:min(980px,100%);max-height:100%;overflow:auto;border-radius:16px 16px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:761px){.scrim{align-items:center;padding:32px}.sheet{border-radius:16px;max-height:calc(100vh - 64px)}}
.sh-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:flex-start;z-index:1}
.sh-head .t{display:grid;gap:6px;min-width:0;flex:1}
.sh-head h2{font-size:1.3rem;font-weight:800}
.sh-head .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.8rem;color:var(--muted);align-items:center}
.sh-actions{display:flex;flex-wrap:wrap;gap:8px}
.sh-body{padding:16px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.pcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pcol{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.pcol h3{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big b{font-family:var(--f-mono);font-size:1.7rem;font-weight:500}
.big span{color:var(--muted);font-size:.85rem}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.split i{display:block;height:100%}
.mx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.78rem}
.mx div{display:grid;gap:1px}
.mx b{font-family:var(--f-mono);font-size:.95rem;font-weight:500}
.mx span{color:var(--muted);display:flex;align-items:center;gap:4px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-family:var(--f-body);white-space:normal}
tfoot td{font-weight:600;border-bottom:0}
.donebtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;justify-self:start}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.steps{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.steps h3{font-size:1rem;margin-bottom:8px}
.steps ol{margin:0;padding-left:1.2em;display:grid;gap:6px;max-width:75ch}
.alts{display:grid;gap:6px}
.alt{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.alt .bar4{align-self:stretch;border-radius:2px;background:var(--c)}
.alt b{font-size:.9rem;font-weight:600}
.alt .d{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-align:right}
.alt:hover{border-color:var(--c)}

/* recetario */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font:inherit;color:inherit}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.rcard{--c:var(--des);text-align:left;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--surface);border-radius:var(--r);padding:12px;display:grid;gap:8px;align-content:start}
.rcard:hover{border-color:var(--c)}
.rcard b{font-family:var(--f-display);font-size:.98rem;line-height:1.2}
.rcard .rm{display:flex;flex-wrap:wrap;gap:6px;font-size:.74rem;color:var(--muted);align-items:center}
.hz{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}

/* compra */
.cfg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.cfg label{font-size:.78rem;color:var(--muted);display:grid;gap:4px}
.cfg select,.cfg input[type=date]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.shopsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat .lab{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:1.3rem;font-weight:500}
.stat small{color:var(--muted);font-size:.76rem}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sec > header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb,var(--sc) var(--tint),var(--surface));border-bottom:1px solid var(--line)}
.sec > header h3{font-size:1rem}
.sec > header .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--sc);color:#fff;flex:none}
.ico svg{width:20px;height:20px}
.item{display:grid;grid-template-columns:auto 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input{width:22px;height:22px;accent-color:var(--accent)}
.thumb{width:40px;height:40px;border-radius:8px;background:color-mix(in srgb,var(--sc) 18%,var(--surface));color:var(--sc);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.9rem}
.iname{display:grid;gap:3px;min-width:0}
.iname b{font-weight:600;font-size:.92rem}

.uses{display:flex;flex-wrap:wrap;gap:4px}
.uses span{font-size:.7rem;background:var(--sunk);border-radius:999px;padding:1px 7px;color:var(--muted)}
.iprice{text-align:right;display:grid;gap:3px;justify-items:end}
.iprice .qty{font-family:var(--f-mono);font-size:1.05rem;font-weight:500}
.iprice .pp{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.iprice .lnk{display:flex;gap:8px;align-items:center}
.iprice a{font-size:.75rem;text-decoration:none;font-weight:600}
.havebtn{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 8px;font-size:.7rem;font-weight:600;color:var(--muted)}
.havebtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item.got{opacity:.5}
.item.got .iname b{text-decoration:line-through}
.item.have{opacity:.45}

@media (max-width:560px){.item{grid-template-columns:auto 36px minmax(0,1fr)}.thumb{width:36px;height:36px}.iprice{grid-column:3;justify-items:start;text-align:left;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}}

/* cocina */
.cook{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cook .wrap{display:grid;gap:16px;padding-block:14px 40px}
.cook-top{display:flex;align-items:center;gap:10px}
.cook-top h2{font-size:1.4rem;font-weight:800;flex:1;min-width:0}
.weigh td{font-size:1rem}
.weigh td.tot{font-size:1.15rem;font-weight:500;color:var(--ink)}
.stepbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.stepbox .sn{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.stepbox p{font-size:clamp(1.15rem,3.5vw,1.5rem);line-height:1.35;margin:0;max-width:40ch;font-family:var(--f-display);font-weight:500}
.stepnav{display:flex;gap:10px;flex-wrap:wrap}
.timer{border:2px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:8px 16px;font-family:var(--f-mono);font-size:1rem;font-weight:500}
.timer.run{background:var(--accent);color:var(--accent-ink)}
.timer.end{background:var(--bad);border-color:var(--bad);color:#fff}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  return ing.reduce((t,[f,a])=>{const m=mac(f,a);return t.map((v,i)=>v+m[i])},[0,0,0,0,0]);
}
function recName(id){return id==='cole'?D.cole.n:id==='libre'?D.libre.n:D.rec[id].n}
function recType(id){return id==='cole'?'alm':id==='libre'?'cen':D.rec[id].t}
function dayTotal(d,who,onlyDone){return mealsFor(d,who).reduce((t,m)=>{if(onlyDone&&!isDone(d,who,m.pos))return t;const x=recMac(m.rid,who)||[0,0,0,0,0];return t.map((v,i)=>v+x[i])},[0,0,0,0,0])}
function target(d,who){const tr=dayPlan(d).train;return D.target[who][tr===true?'train':'rest']}
function pctColor(p){return p>1.06?'var(--bad)':(p<.9?'var(--warn)':'var(--ok)')}
function doneKey(d,who,pos){return iso(d)+'|'+who+'|'+pos}
function isDone(d,who,pos){return !!S.done[doneKey(d,who,pos)]}
function trainTag(tr){return tr===true?'<span class="tag train">Entreno</span>':tr===null?'<span class="tag opt">Entreno opcional</span>':'<span class="tag rest">Descanso</span>'}
function weekStart(w){return addDays(START,w*7)}
function fdate(d){return `${d.getDate()} ${MES[d.getMonth()]}`}

/* registry for clickable meals */
let REG=[];
function reg(o){REG.push(o);return REG.length-1}

/* ---------- HOY ---------- */
function renderHoy(){
  const v=document.getElementById('v-hoy');REG=[];
  const t=today();const before=t<START;const d=before?START:t;
  const dp=dayPlan(d);const hr=new Date().getHours()+new Date().getMinutes()/60;
  const nowSlot=before?0:hr<10.5?0:hr<15.5?1:hr<19?2:3;
  let h=`<div class="hoyhead"><div><span class="note">${before?'El plan empieza el lunes. Esto es lo que toca ese día':'Hoy'}</span><h2>${DIAS[wd(d)]} ${d.getDate()} de ${MESL[d.getMonth()]}</h2></div><div class="sub">${trainTag(dp.train)}<span class="tag rot">${D.weeks[rotOf(d)].n}</span></div></div>`;
  // ahora toca
  const nowItems=whoList().map(w=>mealsFor(d,w).find(m=>m.slot===nowSlot)).filter(Boolean);
  if(nowItems.length){const rid=nowItems[0].rid;const t2=recType(rid);
    const items=whoList().map(w=>({w,m:mealsFor(d,w).find(m=>m.slot===nowSlot&&m.rid===rid)})).filter(x=>x.m);
    const i=reg({rid,d,items:items.map(x=>({who:x.w,pos:x.m.pos}))});
    h+=`<div class="now" style="--c:var(${MC[t2]})"><div><span class="lab">${before?'Primera comida':'Ahora toca'} · ${MEALS[nowSlot].n}</span><b>${esc(recName(rid))}</b></div><span></span><div class="sh-actions">${rid!=='cole'&&rid!=='libre'?`<button class="btn primary" data-cook="${i}">Modo cocina</button>`:''}<button class="btn" data-open="${i}">Ver receta</button></div></div>`;}
  // columnas por persona
  h+=`<div class="hoycols">${whoList().map(w=>{
    const ms=mealsFor(d,w);const dn=ms.filter(m=>m.rid!=='libre'&&isDone(d,w,m.pos)).length;const tot=ms.filter(m=>m.rid!=='libre').length;
    const eaten=dayTotal(d,w,true),tg=target(d,w);
    return `<div class="hcol" style="--pc:var(${WHO[w].c})"><header><i class="dot" style="background:var(${WHO[w].c})"></i><h3>${WHO[w].n}</h3><span class="p">${dn}/${tot} · ${fmt(eaten[0])} / ${fmt(tg[0])} kcal</span></header>
    <span class="meter"><i style="width:${Math.min(100,eaten[0]/tg[0]*100)}%;background:var(${WHO[w].c})"></i></span>
    ${ms.map(m=>{const t3=recType(m.rid);const x=recMac(m.rid,w);const i=reg({rid:m.rid,d,items:[{who:w,pos:m.pos}]});const dn2=isDone(d,w,m.pos);
      return `<div class="hrow" style="--c:var(${MC[t3]})"><span class="bar4"></span><button class="tx" data-open="${i}"><small>${MEALS[m.slot].n}</small><span>${esc(recName(m.rid))}</span><em>${m.rid==='libre'?'Sin contar':fmt(x[0])+' kcal · '+fmt(x[1])+' g P'}</em></button>${m.rid==='libre'?'':`<button class="check" data-done="${doneKey(d,w,m.pos)}" aria-pressed="${dn2}" aria-label="Hecho">✓</button>`}</div>`}).join('')}</div>`}).join('')}</div>`;
  // tareas
  const tasks=tasksFor(d);
  if(tasks.length)h+=`<div class="panel"><h3>Para hoy</h3><div class="tasks">${tasks.map(x=>`<div class="task" style="--c:var(${x.c})"><span class="ti">${x.i}</span><p>${x.t}</p></div>`).join('')}</div></div>`;
  h+=weekSummaryHTML(Math.max(0,Math.floor(diffDays(d,START)/7)),'Esta semana');
  v.innerHTML=h;bindCommon(v);
}
function tasksFor(d){
  const out=[];const tm=addDays(d,1);const ws=['N','T'];
  const frozen=new Set();ws.forEach(w=>mealsFor(tm,w).forEach(m=>{const r=D.rec[m.rid];if(!r)return;(r[w]||[]).forEach(([f])=>{if(FROZEN[f])frozen.add(FROZEN[f])})}));
  if(frozen.size)out.push({c:'--cen',i:'❄',t:`<b>Esta noche</b>, pasa ${[...frozen].join(' y ')} del congelador a la nevera para mañana.`});
  if(dayPlan(d).train===true&&whoList().includes('N'))out.push({c:'--mer',i:'P',t:'<b>Día de entreno:</b> la merienda pre-entreno de Nacho, 1–2 h antes de entrenar.'});
  if(wd(d)<3&&whoList().includes('T'))out.push({c:'--teresa',i:'T',t:'<b>Teresa come en el cole.</b> Si el menú es muy ligero, 50 g más de proteína en la cena.'});
  if(wd(d)===6){
    const nx=[0,1,2].map(i=>mealsFor(addDays(d,1+i),'N')[1]).map(m=>recName(m.rid));
    out.push({c:'--accent',i:'B',t:`<b>Batch cooking (~75 min):</b> cuece el arroz de la semana, cocina los 3 tuppers de Nacho (${[...new Set(nx)].join(', ')}), 4 huevos cocidos, verdura lavada y cortada, y 2 salsas.`});
  }
  if(wd(d)===2)out.push({c:'--pos',i:'S',t:'<b>Miércoles:</b> prepara las salsas del fin de semana y el postre del jueves si lleva preparación.'});
  const prep=new Set();ws.forEach(w=>mealsFor(tm,w).forEach(m=>{if(['tarta','natillas','galletas','trufas','bark','overnight'].includes(m.rid))prep.add(recName(m.rid))}));
  if(prep.size)out.push({c:'--pos',i:'★',t:`<b>Prepara hoy para mañana:</b> ${[...prep].join(', ')}.`});
  return out;
}
function weekSummaryHTML(w,title){
  const ws=weekStart(w);const t=today();
  return `<div class="summary">${whoList().map(who=>{
    let dn=0,tot=0,full=0,days=0,miss={};const avg=[0,0,0,0,0],ga=[0,0,0,0,0];let n=0;
    for(let i=0;i<7;i++){const d=addDays(ws,i);if(d>t)continue;days++;const ms=mealsFor(d,who).filter(m=>m.rid!=='libre');let all=true;
      ms.forEach(m=>{tot++;if(isDone(d,who,m.pos))dn++;else{all=false;miss[MEALS[m.slot].n]=(miss[MEALS[m.slot].n]||0)+1}});if(all&&ms.length)full++;
      if(wd(d)!==5){const a=dayTotal(d,who,true),g=target(d,who);for(let k=0;k<5;k++){avg[k]+=a[k];ga[k]+=g[k]}n++}}
    const pct=tot?dn/tot:0;const worst=Object.entries(miss).sort((a,b)=>b[1]-a[1])[0];
    let msg=!days?'La semana todavía no ha empezado.':pct>=.9?'Semana excelente: así se baja de peso sin perder músculo.':pct>=.75?`Bien. Lo que más se escapa: ${worst?worst[0].toLowerCase():'—'}.`:`Hay que apretar: ${worst?worst[0].toLowerCase()+' es lo que más falla':'marcad lo que coméis'}. Preparadlo con antelación.`;
    return `<div class="who-card"><header><i class="dot" style="background:var(${WHO[who].c})"></i><h3>${WHO[who].n} · ${title}</h3><span class="sub">${days} de 7 días</span></header>
    <div class="adh"><b>${fmt(pct*100)}%</b><span>comidas cumplidas · ${full} días completos</span></div>
    <span class="meter"><i style="width:${pct*100}%;background:${pct>=.9?'var(--ok)':pct>=.75?'var(--warn)':'var(--bad)'}"></i></span>
    ${n?`<div class="metrics">${MACN.map((nm,k)=>{const a=avg[k]/n,g=ga[k]/n,p=a/g;return `<div class="metric"><span class="lab">${nm}</span><span class="val">${fmt(a)}<small>${k?' g':''} / ${fmt(g)}</small></span><span class="meter"><i style="width:${Math.min(100,p*100)}%;background:${k===4?(p>=1?'var(--ok)':'var(--warn)'):pctColor(p)}"></i></span></div>`}).join('')}</div><p class="note">Media diaria de lo marcado como hecho (sin sábados).</p>`:''}
    <p class="msg">${msg}</p></div>`}).join('')}</div>`;
}

/* ---------- PLAN ---------- */
function renderPlan(){
  const v=document.getElementById('v-plan');REG=[];
  const ws=weekStart(S.week),we=addDays(ws,6);const tIso=iso(today());
  let h=`<div class="bar"><div class="weeknav"><button class="iconbtn" id="wprev" aria-label="Semana anterior">‹</button><button class="iconbtn" id="wnext" aria-label="Semana siguiente">›</button>
    <h2>${fdate(ws)} – ${fdate(we)} ${we.getFullYear()}</h2><span class="tag rot">${D.weeks[rotOf(ws)].n}</span></div><span class="spacer"></span><button class="pill" id="wtoday">Esta semana</button></div>`;
  h+=weekSummaryHTML(S.week,'semana');
  h+=`<div class="legend">${MEALS.map(m=>`<span><i class="sw" style="background:var(${MC[m.k]})"></i>${m.n}</span>`).join('')}<span>Toca una comida para ver gramos y macros, cambiarla o cocinarla</span></div>`;
  h+=`<div class="calwrap"><div class="cal"><div class="rowhead"></div>`;
  for(let i=0;i<7;i++){const d=addDays(ws,i);h+=`<div class="dayhead${iso(d)===tIso?' today':''}"><span class="dn">${DIAS[i]}</span><span class="dd">${fdate(d)}</span>${trainTag(dayPlan(d).train)}</div>`}
  MEALS.forEach((m,s)=>{h+=`<div class="rowhead"><b style="color:var(${MC[m.k]})">${m.n}</b><span>${m.h}</span></div>`;for(let i=0;i<7;i++)h+=`<div class="cell">${cellHTML(addDays(ws,i),s)}</div>`});
  h+=`<div class="rowhead"><b>Total del día</b><span>vs objetivo</span></div>`;
  for(let i=0;i<7;i++)h+=`<div class="totals">${whoList().map(w=>totLine(addDays(ws,i),w)).join('')}</div>`;
  h+=`</div></div>`;
  h+=`<div class="daypick">${[0,1,2,3,4,5,6].map(i=>`<button data-day="${i}" aria-pressed="${S.day===i}"><b>${DOW[i]}</b><span>${addDays(ws,i).getDate()}</span></button>`).join('')}</div>`;
  const dd=addDays(ws,S.day);
  h+=`<div class="dayview"><div class="dayhead" style="border:1px solid var(--line);border-radius:var(--r)"><span class="dn">${DIAS[S.day]} ${fdate(dd)}</span>${trainTag(dayPlan(dd).train)}</div>${MEALS.map((m,s)=>{const c=cellHTML(dd,s);return c.includes('class="empty"')?'':`<div class="dv-slot"><h4 style="color:var(${MC[m.k]})">${m.n} · ${m.h}</h4>${c}</div>`}).join('')}<div class="totals" style="border:1px solid var(--line);border-radius:var(--r)">${whoList().map(w=>totLine(dd,w)).join('')}</div></div>`;
  h+=`<div class="two"><div class="panel"><h3>Rotación</h3><p class="note" style="margin-bottom:8px">Tres semanas de menú que se repiten en orden: A, B, C, y vuelta a A. Los desayunos fijos y las meriendas no cambian.</p><ul>${D.weeks.map((w,i)=>`<li><b>${w.n}</b>: ${[...new Set(w.plan.flatMap(p=>[p.N[1],p.N[3]]).filter(x=>x!=='libre'))].slice(0,6).map(recName).join(', ')}…</li>`).join('')}</ul></div>
  <div class="panel"><h3>Reglas para ser estrictos</h3><ol><li>Pesad en crudo, al menos las 3 primeras semanas. El modo cocina os da el total y el reparto.</li><li>Marcad cada comida al terminarla: el resumen semanal sale de ahí.</li><li>Agua: Nacho 2,5–3 l, Teresa 2–2,5 l. Sal con moderación.</li><li>Sábado noche: cena libre, una comida, sin compensar.</li><li>Si algo no apetece, cambiadlo por otra receta parecida en vez de saltároslo.</li></ol></div></div>`;
  h+=`<p class="note">El almuerzo de Teresa en el cole (L–X) cuenta como ~650 kcal y ~30 g de proteína. Los macros salen de tablas nutricionales estándar; las etiquetas pueden variar un 5–10%.</p>`;
  v.innerHTML=h;
  v.querySelector('#wprev').onclick=()=>{S.week=Math.max(0,S.week-1);renderPlan()};
  v.querySelector('#wnext').onclick=()=>{S.week++;renderPlan()};
  v.querySelector('#wtoday').onclick=()=>{goToday();renderPlan()};
  v.querySelectorAll('.daypick button').forEach(b=>b.onclick=()=>{S.day=+b.dataset.day;renderPlan()});
  bindCommon(v);
}
function goToday(){const df=diffDays(today(),START);if(df>=0){S.week=Math.floor(df/7);S.day=df%7}else{S.week=0;S.day=0}}
function cellHTML(d,slot){
  const groups={};whoList().forEach(w=>mealsFor(d,w).filter(m=>m.slot===slot).forEach(m=>{(groups[m.rid]=groups[m.rid]||[]).push({who:w,pos:m.pos,sw:m.rid!==m.orig})}));
  const ids=Object.keys(groups);if(!ids.length)return '<span class="empty">—</span>';
  return ids.map(id=>{const items=groups[id];const i=reg({rid:id,d,items:items.map(x=>({who:x.who,pos:x.pos}))});
    const chips=items.map(x=>{const m=recMac(id,x.who);const dn=isDone(d,x.who,x.pos);return `<span class="chip${dn?' done':''}" title="${WHO[x.who].n}"><i class="k" style="background:${dn?'#fff':`var(${WHO[x.who].c})`}"></i>${dn?'✓ ':''}${id==='libre'?'libre':fmt(m[0])+' kcal · '+fmt(m[1])+' P'}</span>`}).join('');
    const lab=S.who==='both'&&items.length===1?`<span class="who" style="color:var(${WHO[items[0].who].c})">${WHO[items[0].who].n}</span>`:'';
    return `<button class="meal${id==='libre'||id==='cole'?' plain':''}" style="--c:var(${MC[recType(id)]})" data-open="${i}">${lab}${items.some(x=>x.sw)?'<span class="sw2">Cambiada</span>':''}<span class="mn">${esc(recName(id))}</span><span class="chips">${chips}</span></button>`}).join('');
}
function totLine(d,w){const a=dayTotal(d,w),g=target(d,w);const p=a[0]/g[0];const lib=mealsFor(d,w).some(m=>m.rid==='libre');
  return `<div class="tline"><div class="tt"><span style="color:var(${WHO[w].c});font-weight:600">${WHO[w].n}</span><b>${fmt(a[0])}${lib?'+':''} / ${fmt(g[0])}</b></div><span class="meter"><i style="width:${Math.min(100,p*100)}%;background:${lib?'var(--muted)':pctColor(p)}"></i></span><div class="tt"><span>P ${fmt(a[1])} · H ${fmt(a[2])} · G ${fmt(a[3])}</span><span>F ${fmt(a[4])}</span></div></div>`}

function bindCommon(v){
  v.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const o=REG[+b.dataset.open];openRecipe(o.rid,o)});
  v.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>{const o=REG[+b.dataset.cook];openCook(o.rid,o.items.map(x=>x.who))});
  v.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const k=b.dataset.done;put('done',k,S.done[k]?null:1);rerender()});
}

/* ---------- SHEET ---------- */
let lastFocus=null,sheetCtx=null;
function openRecipe(id,ctx){
  lastFocus=lastFocus||document.activeElement;sheetCtx={id,ctx};
  const sc=document.getElementById('scrim');
  const whos=ctx&&ctx.items?ctx.items.map(x=>x.who):['N','T'].filter(w=>whoList().includes(w)&&D.rec[id]&&D.rec[id][w]);

  const t=recType(id);const r=D.rec[id];
  let meta=`<span class="tag" style="background:var(${MC[t]});color:#fff">${TYPEN[t]}</span>`;
  if(r&&r.min)meta+=`<span>${r.min} min</span>`;
  if(ctx&&ctx.d)meta+=`<span>${DIAS[wd(ctx.d)]} ${fdate(ctx.d)}</span>`;
  if(r&&r.src&&D.src[r.src])meta+=`<span>Inspiración: <a href="${D.src[r.src].u}" target="_blank" rel="noopener">${esc(D.src[r.src].n)}</a></span>`;
  let actions='';
  if(id!=='cole'&&id!=='libre')actions+=`<button class="btn primary" id="sh-cook">Modo cocina</button>`;
  if(ctx&&ctx.d&&id!=='cole')actions+=`<button class="btn" id="sh-swap">Cambiar esta comida</button>`;
  const swapped=ctx&&ctx.d&&ctx.items.some(x=>S.swaps[iso(ctx.d)+'|'+x.who+'|'+x.pos]);
  if(swapped)actions+=`<button class="btn" id="sh-undo">Volver a la original</button>`;
  let body='';
  if(id==='libre')body=`<div class="panel"><p style="margin:0;max-width:70ch">Una cena normal en casa o fuera, sin pesar ni compensar al día siguiente: un plato principal con proteína, una bebida y, si apetece, un postre. No cuenta en el total del día.</p></div>`;
  else if(id==='cole'){const m=D.cole.fixed;body=`<div class="pcols"><div class="pcol" style="--pc:var(--teresa)"><h3><i class="dot" style="background:var(--teresa)"></i>Teresa</h3><div class="big"><b>~${fmt(m[0])}</b><span>kcal estimadas</span></div>${mxHTML(m)}<p class="note">Menú equilibrado del comedor escolar. Si un día es muy ligero, sube la cena con 50 g más de proteína.</p>${ctx&&ctx.d?doneBtn(ctx.d,'T',ctx.items[0].pos):''}</div></div>`}
  else{
    body=`<div class="pcols">${shown.map(w=>personCol(id,w,ctx)).join('')}</div>`;
    body+=`<div class="steps"><h3>Cómo se hace</h3><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${r.note?`<p class="note" style="margin-top:10px">${esc(r.note)}</p>`:''}</div>`;
    if(r.salsa){const s=D.salsas.find(x=>x.k===r.salsa);if(s)body+=`<div class="steps"><h3>Salsa: ${esc(s.n)}</h3><p style="margin:0;max-width:75ch">${esc(s.i)}</p></div>`}
  }
  body+=`<div id="swaplist"></div>`;
  sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sh-head"><div class="t"><h2 id="sh-t">${esc(recName(id))}</h2><div class="meta">${meta}</div>${actions?`<div class="sh-actions">${actions}</div>`:''}</div><button class="iconbtn" id="sh-x" aria-label="Cerrar">✕</button></div><div class="sh-body">${body}</div></div>`;
  sc.hidden=false;document.body.style.overflow='hidden';
  sc.querySelector('#sh-x').focus();
  sc.querySelector('#sh-x').onclick=closeSheet;
  sc.onclick=e=>{if(e.target===sc)closeSheet()};
  const ck=sc.querySelector('#sh-cook');if(ck)ck.onclick=()=>openCook(id,shown);
  const swb=sc.querySelector('#sh-swap');if(swb)swb.onclick=()=>showAlts(id,ctx);
  const un=sc.querySelector('#sh-undo');if(un)un.onclick=()=>{ctx.items.forEach(x=>put('swaps',iso(ctx.d)+'|'+x.who+'|'+x.pos,null));const orig=dayPlan(ctx.d)[ctx.items[0].who][ctx.items[0].pos];rerender();openRecipe(orig,ctx)};
  sc.querySelectorAll('.donebtn').forEach(b=>b.onclick=()=>{const k=b.dataset.k;put('done',k,S.done[k]?null:1);b.setAttribute('aria-pressed',!!S.done[k]);b.textContent=S.done[k]?'✓ Hecho':'Marcar como hecho';rerender()});
}
function closeSheet(){const sc=document.getElementById('scrim');sc.hidden=true;sc.innerHTML='';document.body.style.overflow='';sheetCtx=null;if(lastFocus&&document.contains(lastFocus))lastFocus.focus();lastFocus=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.getElementById('cook').hidden)closeCook();else if(!document.getElementById('scrim').hidden)closeSheet()}});
function mxHTML(m){const pk=m[1]*4,ck=m[2]*4,fk=m[3]*9,tot=pk+ck+fk||1;
  return `<div class="split" aria-hidden="true"><i style="width:${pk/tot*100}%;background:var(--alm)"></i><i style="width:${ck/tot*100}%;background:var(--des)"></i><i style="width:${fk/tot*100}%;background:var(--cen)"></i></div>
  <div class="mx"><div><span><i class="sw" style="background:var(--alm)"></i>Proteína</span><b>${fmt(m[1])} g</b></div><div><span><i class="sw" style="background:var(--des)"></i>Hidratos</span><b>${fmt(m[2])} g</b></div><div><span><i class="sw" style="background:var(--cen)"></i>Grasa</span><b>${fmt(m[3])} g</b></div><div><span>Fibra</span><b>${fmt(m[4])} g</b></div></div>`}
function doneBtn(d,w,pos){const k=doneKey(d,w,pos);const dn=!!S.done[k];return `<button class="donebtn" data-k="${k}" aria-pressed="${dn}">${dn?'✓ Hecho':'Marcar como hecho'}</button>`}
function qtyLabel(f,a){const x=D.foods[f];if(x.g){const n=a===0.5?'½ '+x.un:fmt(a,a%1?1:0)+' '+(a===1?x.un:x.un+'s');return `${n} <span style="color:var(--muted)">(${fmt(grams(f,a))} g)</span>`}return fmt(a)+(x.ml?' ml':' g')}
function personCol(id,w,ctx){
  const r=D.rec[id];if(!r[w])return '';const m=recMac(id,w);
  const rows=r[w].map(([f,a])=>{const x=mac(f,a);return `<tr><td>${esc(D.foods[f].n)}</td><td>${qtyLabel(f,a)}</td><td>${fmt(x[0])}</td><td>${fmt(x[1],1)}</td><td>${fmt(x[2],1)}</td><td>${fmt(x[3],1)}</td></tr>`}).join('');
  const it=ctx&&ctx.items?ctx.items.find(x=>x.who===w):null;
  return `<div class="pcol" style="--pc:var(${WHO[w].c})"><h3><i class="dot" style="background:var(${WHO[w].c})"></i>${WHO[w].n}</h3>
  <div class="big"><b>${fmt(m[0])}</b><span>kcal</span>${ctx&&ctx.d?`<span>· ${fmt(m[0]/target(ctx.d,w)[0]*100)}% del día</span>`:''}</div>${mxHTML(m)}
  <div class="tbl"><table><thead><tr><th>Ingrediente</th><th>Cantidad</th><th>kcal</th><th>P</th><th>H</th><th>G</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>Total</td><td></td><td>${fmt(m[0])}</td><td>${fmt(m[1],1)}</td><td>${fmt(m[2],1)}</td><td>${fmt(m[3],1)}</td></tr></tfoot></table></div>
  ${it?doneBtn(ctx.d,w,it.pos):''}</div>`;
}
function showAlts(id,ctx){
  const t=recType(id);const pool=t==='alm'||t==='cen'?['alm','cen']:[t];const whos=ctx.items.map(x=>x.who);
  const cur=whos.map(w=>(recMac(id,w)||[0])[0]);
  const list=Object.values(D.rec).filter(r=>pool.includes(r.t)&&r.id!==id&&r.id!=='fruta'&&whos.every(w=>r[w])).map(r=>{const k=whos.map(w=>recMac(r.id,w)[0]);return {r,k,diff:k.reduce((s,v,i)=>s+Math.abs(v-cur[i]),0)}}).sort((a,b)=>a.diff-b.diff);
  const box=document.getElementById('swaplist');
  box.innerHTML=`<div class="panel"><h3>Cambiar por… <span class="note" style="font-weight:400">(ordenadas por calorías más parecidas)</span></h3><div class="alts">${list.map(x=>`<button class="alt" style="--c:var(${MC[x.r.t]})" data-alt="${x.r.id}"><span class="bar4"></span><span><b>${esc(x.r.n)}</b><br><span class="note">${TYPEN[x.r.t]} · ${x.r.min} min</span></span><span class="d">${whos.map((w,i)=>`<span style="color:var(${WHO[w].c})">${WHO[w].n[0]}</span> ${fmt(x.k[i])} (${x.k[i]-cur[i]>=0?'+':''}${fmt(x.k[i]-cur[i])})`).join('<br>')}</span></button>`).join('')}</div></div>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
  box.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>{const nid=b.dataset.alt;ctx.items.forEach(x=>{const orig=dayPlan(ctx.d)[x.who][x.pos];put('swaps',iso(ctx.d)+'|'+x.who+'|'+x.pos,nid===orig?null:nid)});rerender();openRecipe(nid,ctx)});
}

/* ---------- COCINA ---------- */
let cookTimers=[],wake=null;
function openCook(id,whos){
  const r=D.rec[id];if(!r)return;whos=whos.filter(w=>r[w]);
  const el=document.getElementById('cook');let step=0;
  const foods=[];const qty={};whos.forEach(w=>r[w].forEach(([f,a])=>{if(!qty[f]){qty[f]={};foods.push(f)}qty[f][w]=a}));
  const lab=(f,a)=>a==null?'—':qtyLabel(f,a).replace(/<span[^>]*>\((.*?)\)<\/span>/,'($1)');
  const tot=f=>{const x=D.foods[f];const s=whos.reduce((t,w)=>t+(qty[f][w]||0),0);return x.g?`${fmt(s,s%1?1:0)} ${s===1?x.un:x.un+'s'} · ${fmt(grams(f,s))} g`:`${fmt(s)}${x.ml?' ml':' g'}`};
  function draw(){
    const s=r.steps[step];const mm=s.match(/(\d+)\s*(?:–|-)\s*(\d+)\s*min|(\d+)\s*min/);const mins=mm?(+(mm[2]||mm[3])):0;
    el.innerHTML=`<div class="wrap"><div class="cook-top"><h2>${esc(r.n)}</h2><button class="iconbtn" id="ck-x" aria-label="Salir del modo cocina">✕</button></div>
    <div class="panel tbl"><h3>Pesa esto</h3><table class="weigh"><thead><tr><th>Ingrediente</th>${whos.length>1?'<th>Total</th>':''}${whos.map(w=>`<th style="color:var(${WHO[w].c})">${WHO[w].n}</th>`).join('')}</tr></thead><tbody>${foods.map(f=>`<tr><td>${esc(D.foods[f].n)}</td>${whos.length>1?`<td class="tot">${tot(f)}</td>`:''}${whos.map(w=>`<td>${lab(f,qty[f][w])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="stepbox"><span class="sn">Paso ${step+1} de ${r.steps.length}</span><div class="dots">${r.steps.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><p>${esc(s)}</p>
    <div class="stepnav"><button class="btn" id="ck-prev" ${step?'':'disabled'}>Anterior</button><button class="btn primary" id="ck-next">${step<r.steps.length-1?'Siguiente':'Terminar'}</button>${mins?`<button class="timer" id="ck-t" data-m="${mins}">⏱ ${mins} min</button>`:''}</div></div>
    ${r.salsa&&D.salsas.find(x=>x.k===r.salsa)?`<div class="panel"><h3>Salsa</h3><p style="margin:0">${esc(D.salsas.find(x=>x.k===r.salsa).i)}</p></div>`:''}</div>`;
    el.querySelector('#ck-x').onclick=closeCook;
    el.querySelector('#ck-prev').onclick=()=>{step=Math.max(0,step-1);draw()};
    el.querySelector('#ck-next').onclick=()=>{if(step<r.steps.length-1){step++;draw()}else closeCook()};
    const tb=el.querySelector('#ck-t');if(tb)tb.onclick=()=>startTimer(tb,+tb.dataset.m);
  }
  el.hidden=false;document.body.style.overflow='hidden';draw();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
}
function startTimer(btn,mins){
  let left=mins*60;btn.classList.add('run');const ctx=(()=>{try{return new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}})();
  const id=setInterval(()=>{left--;if(!document.contains(btn)){clearInterval(id);return}
    btn.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
    if(left<=0){clearInterval(id);btn.classList.remove('run');btn.classList.add('end');btn.textContent='¡Listo!';
      try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
      if(ctx){[0,.35,.7].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);g.gain.value=.15;o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.2)})}}},1000);
  cookTimers.push(id);
}
function closeCook(){const el=document.getElementById('cook');el.hidden=true;el.innerHTML='';cookTimers.forEach(clearInterval);cookTimers=[];if(document.getElementById('scrim').hidden)document.body.style.overflow='';try{wake&&wake.release()}catch(e){}wake=null}

/* ---------- RECETAS ---------- */
function renderRecetas(){
  const v=document.getElementById('v-recetas');
  const all=Object.values(D.rec).filter(r=>r.id!=='fruta');
  const ws=whoList();
  let h=`<div class="bar"><h2>Recetario</h2><span class="note">${all.length} recetas, todas en 40 min o menos</span></div>
  <div class="filters"><input class="search" id="rq" type="search" placeholder="Buscar: pollo, salmón, airfryer…" value="${esc(S.q)}" aria-label="Buscar receta">
  ${[['all','Todas','--ink'],['des','Desayunos','--des'],['alm','Almuerzos','--alm'],['cen','Cenas','--cen'],['mer','Meriendas','--mer'],['pos','Postres','--pos'],['salsas','Salsas','--accent']].map(([k,n,c])=>`<button class="fchip" style="--c:var(${c})" data-ft="${k}" aria-pressed="${S.ft===k}">${n}</button>`).join('')}</div><div id="rlist"></div>`;
  v.innerHTML=h;
  const draw=()=>{
    const q=S.q.trim().toLowerCase();const box=v.querySelector('#rlist');
    if(S.ft==='salsas'){box.innerHTML=`<div class="panel tbl"><table><thead><tr><th>Salsa</th><th style="text-align:left">Ingredientes (~4 raciones de 50 g)</th><th style="text-align:left">Va con</th></tr></thead><tbody>${D.salsas.map(s=>`<tr><td><b>${esc(s.n)}</b></td><td style="font-family:var(--f-body);text-align:left;white-space:normal">${esc(s.i)}</td><td style="font-family:var(--f-body);text-align:left;white-space:normal">${esc(s.c)}</td></tr>`).join('')}</tbody></table><p class="note">40–60 kcal por cada 50 g. Duran 4 días en la nevera.</p></div>`;return}
    let out='';['des','alm','cen','mer','pos'].filter(g=>S.ft==='all'||S.ft===g).forEach(g=>{
      const list=all.filter(r=>r.t===g&&ws.some(w=>r[w])&&(!q||r.n.toLowerCase().includes(q)||ws.some(w=>(r[w]||[]).some(([f])=>D.foods[f].n.toLowerCase().includes(q)))));
      if(!list.length)return;
      out+=`<div class="group" style="display:grid;gap:10px"><h3 style="font-size:1.1rem;display:flex;align-items:center;gap:8px"><i class="sw" style="background:var(${MC[g]})"></i>${TYPEP[g]} <span class="note">${list.length}</span></h3><div class="rgrid">${list.map(r=>{
        const ms=ws.filter(w=>r[w]).map(w=>{const m=recMac(r.id,w);return `<span class="chip" style="background:var(--sunk)"><i class="k" style="background:var(${WHO[w].c})"></i>${fmt(m[0])} kcal · ${fmt(m[1])} P</span>`}).join('');
        return `<button class="rcard" style="--c:var(${MC[g]})" data-r="${r.id}"><b>${esc(r.n)}</b><span class="rm"><span>${r.min?r.min+' min':'—'}</span>${r.tags.includes('bd')?'<span class="hz">Nueva</span>':''}${!r.N?'<span class="hz">Solo Teresa</span>':''}</span><span class="chips">${ms}</span></button>`}).join('')}</div></div>`});
    box.innerHTML=out||'<p class="note">Ninguna receta coincide con la búsqueda.</p>';
    box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openRecipe(b.dataset.r,null));
  };
  v.querySelector('#rq').oninput=e=>{S.q=e.target.value;draw()};
  v.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{S.ft=b.dataset.ft;v.querySelectorAll('[data-ft]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
  draw();
}

/* ---------- COMPRA ---------- */
const SECORDER=['Fruta y verdura','Carne','Marisco y pescado','Charcutería y quesos','Huevos, leche y mantequilla','Postres y yogures','Panadería y pastelería','Congelados','Arroz, legumbres y pasta','Conservas, caldos y cremas','Cereales y galletas','Aperitivos','Aceite, especias y salsas','Azúcar, caramelos y chocolate','Cacao, café e infusiones','Fuera de Mercadona'];
const SECC={'Fruta y verdura':'--mer','Carne':'--alm','Marisco y pescado':'--cen','Charcutería y quesos':'--teresa','Huevos, leche y mantequilla':'--des','Postres y yogures':'--nacho','Panadería y pastelería':'--pos','Congelados':'--cen','Arroz, legumbres y pasta':'--des','Conservas, caldos y cremas':'--nacho','Cereales y galletas':'--pos','Aperitivos':'--alm','Aceite, especias y salsas':'--mer','Azúcar, caramelos y chocolate':'--pos','Cacao, café e infusiones':'--pos','Fuera de Mercadona':'--muted'};
const ICON={leaf:'<path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/>',meat:'<path d="M14 4a6 6 0 0 1 4 10l-5 5a4 4 0 0 1-6-1 4 4 0 0 1-1-6l5-5a6 6 0 0 1 3-3z"/>',fish:'<path d="M3 12c3-5 9-6 14-2l4-3v10l-4-3c-5 4-11 3-14-2z"/>',cheese:'<path d="M3 17V10l11-6 7 6v7z"/><path d="M3 10h18"/>',egg:'<path d="M12 3c4 0 7 7 7 11a7 7 0 0 1-14 0c0-4 3-11 7-11z"/>',cup:'<path d="M5 7h14l-2 13H7z"/><path d="M5 7l1-3h12l1 3"/>',bread:'<path d="M6 20V11a4 4 0 0 1 0-7h12a4 4 0 0 1 0 7v9z"/>',snow:'<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/>',grain:'<path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M8 9c0-3 2-5 4-5s4 2 4 5"/>',can:'<ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v12c0 1.4 3 2.5 7 2.5s7-1.1 7-2.5V6"/>',bottle:'<path d="M10 3h4v4l2 3v11H8V10l2-3z"/><path d="M8 14h8"/>',sweet:'<rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 12h16M12 5v14"/>',bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>'};
const SECI={'Fruta y verdura':'leaf','Carne':'meat','Marisco y pescado':'fish','Charcutería y quesos':'cheese','Huevos, leche y mantequilla':'egg','Postres y yogures':'cup','Panadería y pastelería':'bread','Congelados':'snow','Arroz, legumbres y pasta':'grain','Conservas, caldos y cremas':'can','Cereales y galletas':'grain','Aperitivos':'sweet','Aceite, especias y salsas':'bottle','Azúcar, caramelos y chocolate':'sweet','Cacao, café e infusiones':'sweet','Fuera de Mercadona':'bag'};
function icon(k){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]||ICON.bag}</svg>`}
function initials(n){const w=n.replace(/^\d+\s/,'').split(/\s+/).filter(x=>x.length>2&&!/^(de|del|con|sin|para)$/i.test(x));return (w[0]||n)[0].toUpperCase()+((w[1]||'')[0]||'').toLowerCase()}
function computeShop(){
  const from=S.cfg.from?parse(S.cfg.from):(today()<START?START:today());const days=S.cfg.days||10;
  const need={},uses={},pantryUsed=new Set();
  const addNeed=(f,q,rn)=>{need[f]=(need[f]||0)+q;(uses[f]=uses[f]||new Set()).add(rn)};
  for(let i=0;i<days;i++){const d=addDays(from,i);whoList().forEach(w=>mealsFor(d,w).forEach(m=>{
    const r=D.rec[m.rid];if(!r||!r[w])return;r[w].forEach(([f,a])=>{
      if(D.split[f]){const g=grams(f,a);Object.entries(D.split[f]).forEach(([k,fr])=>{if(k[0]==='P')pantryUsed.add(k);else addNeed(k,g*fr,r.n)})}
      else addNeed(f,D.unitf.includes(f)?a:grams(f,a),r.n)})}))}
  const rows={};
  Object.entries(need).forEach(([f,q])=>{const opts=D.fmap[f];if(!opts)return;
    if(opts[0][0]==='P'||opts[0][0]==='X'){pantryUsed.add(opts[0]);(rows[opts[0]]=rows[opts[0]]||{q:1,u:new Set()});uses[f].forEach(u=>rows[opts[0]].u.add(u));return}
    const P=opts.map(id=>D.prods[id]);
    // greedy combo vs all-largest
    let rem=q,combo=[];P.forEach((p,i)=>{if(i<P.length-1){const n=Math.floor(rem/p.sz);if(n){combo.push([p,n]);rem-=n*p.sz}}else{const n=Math.ceil(Math.max(0,rem-1e-6)/p.sz);if(n)combo.push([p,n])}});
    const big=[[P[0],Math.ceil(q/P[0].sz)]];const cost=c=>c.reduce((s,[p,n])=>s+p.p*n,0);
    (cost(big)<=cost(combo)?big:combo).forEach(([p,n])=>{const r=rows[p.id]=rows[p.id]||{q:0,u:new Set()};r.q+=n;uses[f].forEach(u=>r.u.add(u))})});
  Object.keys(D.prods).filter(id=>D.prods[id].pantry).forEach(id=>{if(!rows[id])rows[id]={q:1,u:new Set()}});
  return {from,days,rows};
}
function renderCompra(){
  const v=document.getElementById('v-compra');
  const {from,days,rows}=computeShop();const to=addDays(from,days-1);
  const ids=Object.keys(rows);let tf=0,tp=0,got=0,act=0;
  ids.forEach(id=>{const p=D.prods[id];if(S.have[id])return;act++;if(S.got[id])got++;const c=p.p*rows[id].q;if(p.pantry)tp+=c;else tf+=c});
  const fromV=S.cfg.from||iso(from);
  let h=`<div class="bar"><h2>Lista de la compra</h2><span class="spacer"></span><label class="pill" style="display:inline-flex;gap:8px;align-items:center"><input type="checkbox" id="hidegot" ${S.hideGot?'checked':''}> Ocultar comprado y en casa</label><span id="resetbox"><button class="btn" id="reset">Nueva compra</button></span></div>
  <div class="cfg"><label for="c-days">Para cuántos días<select id="c-days">${[3,5,7,10,14].map(n=>`<option value="${n}" ${n===days?'selected':''}>${n} días</option>`).join('')}</select></label>
  <label for="c-from">Desde<input type="date" id="c-from" value="${fromV}"></label>
  <span class="note" style="flex:1;min-width:200px">Para <b>${S.who==='both'?'los dos':WHO[S.who].n}</b> (cámbialo arriba). Tiene en cuenta las comidas que hayáis cambiado y la rotación de semanas.</span></div>
  <div class="shopsum">
   <div class="stat"><span class="lab">Cubre</span><b>${days} días</b><small>${DIAS[wd(from)].toLowerCase()} ${fdate(from)} – ${DIAS[wd(to)].toLowerCase()} ${fdate(to)}</small></div>
   <div class="stat"><span class="lab">Compra</span><b>${eur(tf)}</b><small>Fresco, congelado y proteína</small></div>
   <div class="stat"><span class="lab">Despensa</span><b>${eur(tp)}</b><small>Lo que no marquéis «en casa»</small></div>
   <div class="stat"><span class="lab">En el carro</span><b>${got} / ${act}</b><small>productos</small></div></div>
  <p class="note">Nombres tal cual aparecen en Mercadona, ordenados por sus secciones; la foto está en la «Ficha». Precios del catálogo online (8 nov 2026, almacén de Sevilla). Marca <b>En casa</b> lo que ya tengáis y desaparece del total.</p>`;
  SECORDER.forEach(sec=>{
    const items=ids.filter(id=>D.prods[id].s===sec).sort((a,b)=>(D.prods[a].pantry?1:0)-(D.prods[b].pantry?1:0)||D.prods[a].n.localeCompare(D.prods[b].n));
    if(!items.length)return;const c=SECC[sec];const sub=items.reduce((t,id)=>t+(S.have[id]?0:D.prods[id].p*rows[id].q),0);
    h+=`<div class="sec${S.hideGot?' hidegot':''}" style="--sc:var(${c})"><header><span class="ico">${icon(SECI[sec])}</span><h3>${esc(sec)}</h3><span class="cnt">${items.length} · ${sub?eur(sub):'—'}</span></header>`;
    items.forEach(id=>{const p=D.prods[id],r=rows[id];const g=!!S.got[id],hv=!!S.have[id];
      h+=`<div class="item${g?' got':''}${hv?' have':''}"><input type="checkbox" id="g-${id}" data-k="${id}" ${g?'checked':''} aria-label="Comprado: ${esc(p.n)}">
      <span class="thumb" aria-hidden="true">${initials(p.n)}</span>
      <div class="iname"><label for="g-${id}"><b>${esc(p.n)}</b></label><span class="fmt">${esc(p.f)}${p.p?` · ${eur(p.p)}/ud`:''} ${p.pantry?'<span class="hz">Despensa</span>':''}</span>${r.u.size?`<span class="uses">${[...r.u].slice(0,4).map(u=>`<span>${esc(u)}</span>`).join('')}${r.u.size>4?`<span>+${r.u.size-4}</span>`:''}</span>`:''}</div>
      <div class="iprice"><span class="qty">×${r.q}</span>${p.p?`<span class="pp">${eur(p.p*r.q)}</span>`:''}<span class="lnk"><button class="havebtn" data-have="${id}" aria-pressed="${hv}">En casa</button>${p.url?`<a href="${p.url}" target="_blank" rel="noopener">Ficha ↗</a>`:''}</span></div></div>`});
    h+=`</div>`;
  });
  v.innerHTML=h;
  v.querySelector('#c-days').onchange=e=>{S.cfg.days=+e.target.value;store.set('pnt-cfg',S.cfg);renderCompra()};
  v.querySelector('#c-from').onchange=e=>{S.cfg.from=e.target.value||null;store.set('pnt-cfg',S.cfg);renderCompra()};
  v.querySelectorAll('.item input').forEach(cb=>cb.onchange=()=>{put('got',cb.dataset.k,cb.checked?1:null);renderCompra()});
  v.querySelectorAll('[data-have]').forEach(b=>b.onclick=()=>{const k=b.dataset.have;put('have',k,S.have[k]?null:1);renderCompra()});
  v.querySelector('#hidegot').onchange=e=>{S.hideGot=e.target.checked;store.set('pnt-hide',S.hideGot);v.querySelectorAll('.sec').forEach(s=>s.classList.toggle('hidegot',S.hideGot))};
  v.querySelector('#reset').onclick=()=>{const box=v.querySelector('#resetbox');box.innerHTML=`<span style="display:inline-flex;gap:6px;align-items:center;font-size:.85rem">¿Desmarcar lo comprado? <button class="btn danger" id="rs-y">Sí</button><button class="btn" id="rs-n">No</button></span>`;
    box.querySelector('#rs-y').onclick=()=>{clearField('got');renderCompra()};box.querySelector('#rs-n').onclick=()=>renderCompra()};
}

/* ---------- ROUTER ---------- */
const VIEWS={hoy:renderHoy,plan:renderPlan,compra:renderCompra,recetas:renderRecetas};
function rerender(){const st=window.scrollY;VIEWS[S.view]();window.scrollTo(0,st)}
function route(){let t=(location.hash||'#hoy').slice(1);if(!VIEWS[t])t='hoy';S.view=t;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===t?'page':'false'));
  Object.keys(VIEWS).forEach(k=>document.getElementById('v-'+k).hidden=k!==t);VIEWS[t]()}
document.querySelectorAll('.top .seg button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.who===S.who);b.onclick=()=>{S.who=b.dataset.who;store.set('pnt-who',S.who);document.querySelectorAll('.top .seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));rerender()}});
window.addEventListener('hashchange',route);
goToday();route();initSync();
</script>
